<!doctype html><meta charset="utf-8">
<!-- fx peek: three explosion looks side by side at three frames (r51 lab, wiki §10).
     node tools/peek.mjs test/fxpeek.html out.png — edit `combos` to compare sizes. --><body style="margin:0;background:#05060a">
<canvas id="c" width="1920" height="2562"></canvas>
<script type="module">
import { makeGame, startRun, explode, TIER, FAM, update, spawnEnemy } from '../src/core/game.js';
import { draw, prefs, resetHud } from '../src/render/renderer.js';
const c = document.getElementById('c'), ctx = c.getContext('2d');
const combos = [['classic', 1], ['bloom', 1], ['heavy', 1]];
const off = document.createElement('canvas'); off.width = 320; off.height = 427; const octx = off.getContext('2d');
for (let col = 0; col < 3; col++) for (let row = 0; row < 3; row++) {
  const g = makeGame(7); startRun(g, 600); resetHud();
  for (let i = 0; i < 40; i++) update(g); // some enemies + bullets on screen
  explode(g, 160, 150, TIER.BIG, FAM.ORANGE, 14); explode(g, 80, 260, TIER.POP, FAM.ORANGE, 8); explode(g, 230, 300, TIER.BIG, FAM.ORANGE, 16); explode(g, 60, 120, TIER.MED, FAM.CYAN, 10); explode(g, 250, 200, TIER.POP, FAM.ORANGE, 8);
  for (let i = 0; i < [3, 10, 18][row]; i++) update(g);
  prefs.fxStyle = combos[col][0]; prefs.fxSize = combos[col][1];
  octx.setTransform(1, 0, 0, 1, 0, 0); draw(g, octx, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, col * 640, row * 854, 640, 854);
  ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 22px monospace'; ctx.fillText(`${combos[col][0]} ${combos[col][1]}×  f+${[3, 10, 18][row]}`, col * 640 + 12, row * 854 + 30);
}
window.__done = true;
</script></body>
