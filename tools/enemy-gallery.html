<!doctype html><html><head><meta charset="utf-8"><title>SPEEDHELL enemy gallery</title>
<style>body{margin:0;background:#0a0c14;color:#8a8fa8;font:12px monospace;display:grid;place-items:center;height:100vh}canvas{image-rendering:pixelated;background:#0a0c14}</style></head>
<body><canvas id="c" width="480" height="150" style="width:1440px;height:450px"></canvas>
<script type="module">
import { drawEnemy, drawPlayer } from '../src/render/renderer.js';
const ctx = document.getElementById('c').getContext('2d');
const g = { frame: 300, player: { x: 240, y: 300, prevX: 240, prevY: 300, invuln: 0, focus: false } };
const gf = { frame: 300, player: { x: 300, y: 300, prevX: 300, prevY: 300, invuln: 0, focus: true } };
const E = (type, x, y, o = {}) => ({ type, x, y, vx: 0, vy: 0, age: 0, phase: 0, vulnAt: 0, flash: 0, side: 1, hp: 1, ...o });
const es = [
  ['popcorn', E(0, 30, 50, { vx: 0.47, vy: 1.6 })], ['diver', E(0, 70, 50, { phase: 1, vx: 1.2, vy: 1.4 })],
  ['crosser', E(0, 115, 50, { phase: 2, vx: 1.7, vy: 0.3 })], ['riser', E(0, 160, 50, { phase: 3, vx: 0, vy: -2.4 })],
  ['riser fall', E(0, 200, 50, { phase: 3, vx: 0, vy: 1.6, age: 220 })], ['mid', E(1, 255, 50, { vy: 1.5 })],
  ['turret', E(2, 310, 50)], ['angry', E(2, 355, 50, { vulnAt: 0 })], ['elite', E(3, 415, 50)],
  ['midboss', E(4, 60, 115)], ['midboss B', E(4, 150, 115, { phase: 1 })], ['armored', E(1, 240, 115, { vulnAt: -1 })], ['hit-flash', E(3, 330, 115, { flash: 1 })],
];
function frame() {
  g.frame++; ctx.fillStyle = '#0a0c14'; ctx.fillRect(0, 0, 480, 150);
  drawPlayer(ctx, { ...g, player: { ...g.player, x: 420, y: 115 } }); drawPlayer(ctx, { ...gf, player: { ...gf.player, x: 460, y: 115 } });
  ctx.fillStyle = '#5a6480'; ctx.font = '6px monospace'; ctx.textAlign = 'center'; ctx.fillText('player', 420, 149); ctx.fillText('focus', 460, 149);
  // a pink round bullet at true hit distance from the focused core (6px = hitR + bullet r)
  ctx.fillStyle = '#20060f'; ctx.beginPath(); ctx.arc(466, 115, 5.6, 0, 7); ctx.fill(); ctx.fillStyle = '#ff4fa3'; ctx.beginPath(); ctx.arc(466, 115, 4.2, 0, 7); ctx.fill();
  for (const [name, e] of es) { e.age++; drawEnemy(ctx, g, e); ctx.fillStyle = '#5a6480'; ctx.font = '6px monospace'; ctx.textAlign = 'center'; ctx.fillText(name, e.x, e.y + 34); }
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
