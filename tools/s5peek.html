<!doctype html><meta charset="utf-8">
<!-- STAGE 5 peek (r85): headless sheets of THE GREAT ALTAR drawn by the BASE skin (the
     cute-occult creatures for the finale are a later pass; every other skin falls back
     to the base painter — renderer drawEnemy). Stage 5 IS in STAGES since r85, so this
     page just plays it: the referee's expert bot on seed C0FFEE from startRun(g, 0, 4)
     with its LIVES PINNED (probe-only, so one run reaches everything; the honest bot
     tables are tools/probes/stage5-probe.mjs and idol-probe.mjs).
       node tools/peek.mjs 'tools/s5peek.html?mode=sections' docs/img/r85-s5-sections.png 1940x1340
       node tools/peek.mjs 'tools/s5peek.html?mode=gauntlet' docs/img/r85-s5-gauntlet.png 1940x700
       node tools/peek.mjs 'tools/s5peek.html?mode=boss'     docs/img/r85-s5-boss.png     1940x700
     mode=sections: each section at its entry frame + 120 f, plus the run's densest frame,
     each with the draw time of 60 draws averaged (S8 budget 16.6 ms). mode=gauntlet: the
     three RETURNING midbosses — the Hearse (with its anchor), the lone enraged Moth, the
     Gatekeeper (bars down) — each drawn by its OWN stage's painter through e.role.
     mode=boss: the Idol's four forms ~150 f in (forms 1-3 melted to 1 hp so one run
     reaches the medley). ?skin=cute-occult shows the base-skin fallback. -->
<body style="margin:0;background:#05060a">
<canvas id="c" width="1940" height="1340"></canvas>
<script type="module">
import { makeGame, startRun, update, W, H } from '../src/core/game.js';
import { draw, resetHud, setSkin } from '../src/render/renderer.js';
import { STAGES } from '../src/core/stages/index.js';
import { makeBot } from '../test/bot.mjs';
const Q = new URLSearchParams(location.search), MODE = Q.get('mode') || 'sections', SC = 1.5;
setSkin(Q.get('skin') || 'base');
const LV = STAGES.findIndex((s) => s.id === 5);
const SEC = STAGES[LV].SECTIONS;
const FORMS = ['THE IDOL', 'THE DEMON', "THE PRIESTESS'S MIRROR", 'THE HOLLOW CORE'];
const GUARD = { 1: 'THE HEARSE (stage 2 returns — its anchor swings)', 3: 'THE GATEKEEPER (stage 4 returns — the bars fall)' };
const c = document.getElementById('c'), ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
const label = (t, x, y) => { ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'left'; ctx.fillText(t, x, y); };
const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d');
const stub = { next: () => 0.5, range: (a, b) => (a + b) / 2 };
function render(gg, measure) {
  const real = gg.rng; gg.rng = stub; octx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < 30; i++) draw(gg, octx, gg.stageT * 1.05);
  let ms = 0;
  if (measure) { const t0 = performance.now(); for (let i = 0; i < 60; i++) draw(gg, octx, gg.stageT * 1.05); ms = (performance.now() - t0) / 60; }
  gg.rng = real; return ms;
}
const tiles = [];
function snap(gg, text, measure) { const ms = render(gg, measure); const im = document.createElement('canvas'); im.width = W; im.height = H; im.getContext('2d').drawImage(off, 0, 0); tiles.push({ im, text: text + (measure ? ` · draw ${ms.toFixed(2)} ms` : '') }); return ms; }
const BOT = { aggressive: true, lookahead: 14, reactDelay: 0 };
const perf = { maxBullets: 0, draw: 0 };
let maxB = -1, maxAt = 0;
if (MODE === 'sections') { // pass 1: find the densest frame so pass 2 can capture it exactly
  const q = makeGame(0xC0FFEE); startRun(q, 0, LV); const b2 = makeBot(BOT);
  while (q.state === 'play' && q.frame < 20000) { b2(q); q.player.lives = 9; update(q); if (q.eBullets.count > maxB) { maxB = q.eBullets.count; maxAt = q.frame; } }
}
const g = makeGame(0xC0FFEE); startRun(g, 0, LV); resetHud();
// gauntlet: the PASSIVE bot leaves each guard alive long enough for its shape to be up
const bot = makeBot(MODE === 'gauntlet' ? { aggressive: false, lookahead: 10, reactDelay: 7 } : BOT);
const entered = {}; const gseen = {};
let prevPhase = -1, phaseAt = 0, denseDone = false;
for (let f = 0; f < 30000 && g.state === 'play'; f++) {
  bot(g); g.player.lives = 9; update(g);
  let boss = null, mid = null;
  for (let i = 0; i < g.enemies.count; i++) { const e = g.enemies.items[i]; if (e.type === 5) boss = e; if ((e.type === 4 || e.type === 13) && !e.dead) mid = e; }
  if (MODE === 'sections') {
    for (let i = 1; i < SEC.length; i++) if (!(i in entered) && g.stageT >= SEC[i].t) entered[i] = g.frame;
    // the approach sections are captured deep enough in for their LANDMARK to have
    // scrolled into the field (ly = (stageT − secT)·0.55 − h − 20, renderer); the
    // gated ones are captured at entry + 120 f, since a gate freezes stageT
    for (let i = 1; i < SEC.length; i++) { const off = i <= 2 ? 470 : 120; if (entered[i] === g.frame - off && !entered['s' + i]) { entered['s' + i] = 1; snap(g, `${SEC[i].label} · stageT ${g.stageT} f${g.frame} · enemies ${g.enemies.count} bullets ${g.eBullets.count}`); } }
    if (g.frame === maxAt && !denseDone) { denseDone = true; perf.maxBullets = g.eBullets.count; perf.draw = snap(g, `RUN'S DENSEST FRAME · stageT ${g.stageT} f${g.frame} · bullets ${g.eBullets.count} enemies ${g.enemies.count}`, true); }
  } else if (MODE === 'gauntlet') {
    if (mid) {
      const key = mid.type === 13 ? 'moth' : 'r' + mid.role;
      const name = mid.type === 13 ? 'A TWIN MOTH, ALONE (stage 3 returns — it enrages at once)' : GUARD[mid.role];
      if (!gseen[key]) gseen[key] = g.frame;
      if (g.frame === gseen[key] + 190) snap(g, `GUARD ${Object.keys(gseen).length}/3 — ${name} · hp ${mid.hp | 0} · bullets ${g.eBullets.count}`
        + (mid.role === 3 ? ` · arms x${mid.bobX | 0}/${mid.bobX2 | 0}` : mid.role === 1 ? ` · anchor (${mid.bobX | 0},${mid.bobY | 0})` : ''), Object.keys(gseen).length === 3);
    }
  } else if (MODE === 'boss') {
    if (boss) {
      if (boss.phase < 3 && boss.vulnAt >= 0 && g.frame - phaseAt > 160 && boss.hp > 1) boss.hp = 1; // probe-only melt, so one run shows all four
      if (boss.phase !== prevPhase) { prevPhase = boss.phase; phaseAt = g.frame; }
      if (g.frame === phaseAt + 150) { perf.draw = Math.max(perf.draw, snap(g, `FORM ${boss.phase + 1} · ${FORMS[boss.phase]} · +150f · hp ${boss.hp | 0} · bullets ${g.eBullets.count}`, true)); perf.maxBullets = Math.max(perf.maxBullets, g.eBullets.count); }
    }
  }
  if (MODE === 'boss' && tiles.length >= 4) break;
  if (MODE === 'gauntlet' && tiles.length >= 3) break;
}
const cols = MODE === 'sections' ? 4 : tiles.length || 1, tw = W * SC, th = H * SC;
ctx.font = 'bold 15px monospace';
label(`STAGE 5 — THE GREAT ALTAR (r85, base skin${Q.get('skin') ? ' fallback via ?skin=' + Q.get('skin') : ''}) · seed C0FFEE · ${MODE === 'gauntlet' ? 'passive-human bot' : 'expert bot'}, lives pinned · outcome ${g.state} f${g.frame}`
  + (perf.draw ? ` · peak ${perf.maxBullets} bullets in ${perf.draw.toFixed(2)} ms (budget 16.6)` : ''), 4, 16);
for (let i = 0; i < tiles.length; i++) {
  const x = (i % cols) * (tw + 4), y = Math.floor(i / cols) * (th + 30) + 46;
  ctx.drawImage(tiles[i].im, x, y, tw, th);
  label(tiles[i].text, x + 4, y - 8);
}
window.__perf = perf; window.__tiles = tiles.length; window.__done = true;
</script></body>
