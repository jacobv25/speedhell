<!doctype html><meta charset="utf-8">
<!-- CAMPAIGN RECEIPT peek (r85): the card the five-stage clear ends on
     (src/results.js `buildReceipt`, campaign mode). This page runs the REAL
     receipt code against a REAL finished run — it plays all five stages headlessly
     first — and reproduces index.html's results-card markup and the CSS rules that
     style it, because tools/peek.mjs serves only html/js (a .css file would arrive
     as text/plain and be ignored).
       node tools/peek.mjs 'tools/receiptpeek.html?card=campaign' docs/img/r85-campaign-receipt.png 900x760
       node tools/peek.mjs 'tools/receiptpeek.html?card=stage'    docs/img/r85-stage5-receipt.png   900x760
     THE RUN IS A WALK, NOT A PERFORMANCE (probe-only, and labelled on the page):
     the ship holds the bottom centre with the shot down and is invulnerable, and
     every midboss / boss is melted to 1 hp once it is vulnerable, so one page load
     reaches the fifth clear in ~20 k frames. The clocks and scores on the card are
     therefore a walk's, not an expert's — the honest numbers are
     tools/probes/stage5-probe.mjs §3. What this sheet checks is the CARD: does the
     campaign read as a shape (S6 "legible without reading numbers")? -->
<style>
  html, body { margin: 0; height: 100%; background: #05060a; display: grid; place-items: center; }
  .hide { display: none !important; }
  #results { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; }
  #resultsCard { min-width: 280px; max-width: 92vw; padding: 16px 22px; background: rgba(8,10,18,.94);
    border: 1px solid #2a3050; font: 12px monospace; color: #c8cde4; text-align: center; }
  #resultsCard h1 { margin: 0 0 8px; font: bold 14px monospace; letter-spacing: .25em; color: #ff4fa3; }
  #resultsCard .rsub { font-size: 10px; letter-spacing: .15em; color: #8a8fa8; margin-bottom: 6px; }
  #resultsCard .rtag { color: #ffd24a; font-size: 10px; margin: 6px 0; }
  #resultsCard .rlab { color: #8a8fa8; font-size: 10px; margin: 4px 0; }
  #resScore { font: bold 22px monospace; color: #e8ecf8; letter-spacing: .1em; margin: 6px 0; }
  #resStats { line-height: 1.7; color: #8a8fa8; }
  #resBadges { margin: 8px 0; color: #ffd24a; font-weight: bold; letter-spacing: .2em; min-height: 1em; }
  #resCampaign table { border-collapse: collapse; margin: 6px auto 2px; }
  #resCampaign td { padding: 1px 8px; font: 11px monospace; color: #8a8fa8; text-align: left; white-space: nowrap; }
  #resCampaign td.nm { color: #cdd3e8; }
  #resCampaign td.sc { text-align: right; color: #e8ecf8; }
  #resCampaign td.bd { color: #ffd24a; letter-spacing: .1em; }
  #resCampaign tr.tot td { border-top: 1px solid #2a3050; color: #ffd24a; padding-top: 3px; }
  #resCampaign .stock { font: 11px monospace; color: #ffd24a; letter-spacing: .18em; margin-top: 3px; }
  #entry .elabel { color: #57e389; margin-bottom: 6px; }
  #entry .eslots span { display: inline-block; width: 26px; font: bold 20px monospace; color: #e8ecf8;
    border-bottom: 2px solid #2a3050; margin: 0 4px; }
  #entry .eslots span.sel { color: #ff4fa3; border-color: #ff4fa3; }
  #resultsCard .note { margin-top: 8px; font-size: 10px; color: #5a6480; }
  #peeknote { position: fixed; left: 0; right: 0; top: 8px; text-align: center; font: 12px monospace; color: #ffd24a; }
</style>
<body>
<div id="peeknote"></div>
<div id="results" class="hide">
  <div id="resultsCard">
    <h1 id="resTitle">GAME OVER</h1>
    <div id="resSub" class="rsub hide"></div>
    <div id="resScore">000000000</div>
    <div id="resStats"></div>
    <div id="resBadges"></div>
    <div id="resCampaign" class="hide"></div>
    <div id="resTag" class="rtag hide"></div>
    <div id="resLab" class="rlab hide"></div>
    <div id="entry" class="hide">
      <div class="elabel">NEW HI-SCORE — enter your name</div>
      <div class="eslots"><span>A</span><span>A</span><span>A</span></div>
      <div class="note">type, or ↑↓ letter · ←→ slot · Enter/Ⓐ next · last slot saves</div>
    </div>
    <div class="note" id="resHint">SHOT retry · Ⓑ title · START menu</div>
  </div>
</div>
<script type="module">
import { makeGame, startRun, nextStage, update, W, H } from '../src/core/game.js';
import { STAGES } from '../src/core/stages/index.js';
import { syncReceipt } from '../src/results.js';
import { initLab } from '../src/lab.js';
initLab(); // the shell always does this before a receipt exists; without it labStamp() reads undefined and the card grows a false lab line
const Q = new URLSearchParams(location.search), CARD = Q.get('card') || 'campaign';
const g = makeGame(0xC0FFEE); startRun(g);
let frames = 0;
for (let lv = 0; lv < STAGES.length; lv++) {
  while (g.state === 'play' && frames < 60000) {
    frames++;
    g.input.dx = g.player.x < W / 2 - 2 ? 1 : g.player.x > W / 2 + 2 ? -1 : 0;
    g.input.dy = g.player.y < H - 53 ? 1 : 0;
    g.input.fire = true; g.input.bomb = false; g.input.focus = false;
    g.player.invuln = 1e9;
    for (let i = 0; i < g.enemies.count; i++) { // the melt: a walk cannot kill a boss, so the walk is given the kill
      const e = g.enemies.items[i];
      if ((e.type === 4 || e.type === 5 || e.type === 13) && e.vulnAt >= 0 && e.hp > 1) e.hp = 1;
    }
    update(g);
  }
  if (g.state !== 'stageclear') break;
  nextStage(g);
}
document.getElementById('peeknote').textContent =
  `CAMPAIGN RECEIPT peek (r85) — ${CARD === 'campaign' ? 'the CAMPAIGN card' : "stage 5's own card, shown first"} · a melted invulnerable WALK, seed C0FFEE · state ${g.state} · ${g.stageLog.length}/5 stages · f${g.frame}`;
syncReceipt(g, 'FULL RUN', false, CARD === 'campaign');
window.__done = true;
</script></body>
