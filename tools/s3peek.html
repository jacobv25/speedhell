<!doctype html><meta charset="utf-8">
<!-- STAGE 3 peek (r82): headless sheets of THE CANDLE SEA drawn by the BASE skin (the
     cute-occult creatures for the new types are a later pass). The referee's expert
     bot plays seed C0FFEE from startRun(g, 0, 2) with its LIVES PINNED (a probe-only
     edit so one run reaches every form; the honest bot table is stage3-probe.mjs).
       node tools/peek.mjs 'tools/s3peek.html?mode=sections' docs/img/r82-s3-sections.png 1940x1340
       node tools/peek.mjs 'tools/s3peek.html?mode=boss'     docs/img/r82-s3-boss.png     1460x700
       node tools/peek.mjs 'tools/s3peek.html?mode=moths'    docs/img/r82-s3-moths.png    1940x700
     mode=sections: each section at its entry frame + 120f, plus the SWARM RUSH's densest
     frame (the stage's S8 stress scene) and the run's densest frame, each with the draw
     time of 60 draws averaged (S8 budget 16.6 ms). mode=boss: the three forms, ~150f into
     each. mode=moths: four frames 25f apart across the pair fight (the curtain, the
     mirror, the enrage). ?skin=cute-occult shows the base-skin fallback. -->
<body style="margin:0;background:#05060a">
<canvas id="c" width="1940" height="1340"></canvas>
<script type="module">
import { makeGame, startRun, update, W, H } from '../src/core/game.js';
import { draw, resetHud, setSkin } from '../src/render/renderer.js';
import { STAGES } from '../src/core/stages/index.js';
import { makeBot } from '../test/bot.mjs';
const Q = new URLSearchParams(location.search), MODE = Q.get('mode') || 'sections', SC = 1.5;
setSkin(Q.get('skin') || 'base');
const c = document.getElementById('c'), ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
const label = (t, x, y) => { ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'left'; ctx.fillText(t, x, y); };
const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d');
const stub = { next: () => 0.5, range: (a, b) => (a + b) / 2 };
function render(measure) {
  const real = g.rng; g.rng = stub; octx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < 30; i++) draw(g, octx, g.stageT * 1.05); // settle the HUD tick
  let ms = 0;
  if (measure) { const t0 = performance.now(); for (let i = 0; i < 60; i++) draw(g, octx, g.stageT * 1.05); ms = (performance.now() - t0) / 60; }
  g.rng = real; return ms;
}
const tiles = [];
function snap(text, measure) { const ms = render(measure); const im = document.createElement('canvas'); im.width = W; im.height = H; im.getContext('2d').drawImage(off, 0, 0); tiles.push({ im, text: text + (measure ? ` · draw ${ms.toFixed(2)} ms` : '') }); return ms; }
const SEC = STAGES[2].SECTIONS, RUSH = SEC[5].t, RELEASE = SEC[6].t;
const BOT = { aggressive: true, lookahead: 14, reactDelay: 0 };
const g = makeGame(0xC0FFEE); startRun(g, 0, 2); resetHud();
const bot = makeBot(MODE === 'moths' ? { aggressive: false, lookahead: 10, reactDelay: 7 } : BOT); // moths: the passive bot keeps the pair alive long enough to show the curtain and the enrage
const entered = {}; let maxB = -1, maxAt = 0, rushB = -1, rushAt = 0, prevPhase = -1, phaseAt = 0, mothAt = 0, mothShots = 0, denseDone = false, rushDone = false;
const perf = { maxBullets: 0, draw: 0, rushBullets: 0, rushDraw: 0 };
{ // pass 1: find the densest frame of the run AND of the swarm rush (pass 2 captures them exactly)
  const q = makeGame(0xC0FFEE); startRun(q, 0, 2); const b2 = makeBot(BOT);
  while (q.state === 'play' && q.frame < 20000) {
    b2(q); q.player.lives = 9; update(q);
    if (q.eBullets.count > maxB) { maxB = q.eBullets.count; maxAt = q.frame; }
    if (q.stageT >= RUSH && q.stageT < RELEASE && q.eBullets.count > rushB) { rushB = q.eBullets.count; rushAt = q.frame; }
  }
}
for (let f = 0; f < 20000 && g.state === 'play'; f++) {
  bot(g); g.player.lives = 9; update(g);
  let boss = null, moth = null;
  for (let i = 0; i < g.enemies.count; i++) { const e = g.enemies.items[i]; if (e.type === 5) boss = e; if (e.type === 13) moth = e; }
  if (MODE === 'sections') {
    for (let i = 1; i < SEC.length; i++) if (!(i in entered) && g.stageT >= SEC[i].t) entered[i] = g.frame;
    for (let i = 1; i < SEC.length; i++) if (entered[i] === g.frame - 120 && !entered['s' + i]) { entered['s' + i] = 1; snap(`${SEC[i].label} · stageT ${g.stageT} f${g.frame} · enemies ${g.enemies.count} bullets ${g.eBullets.count}`); }
    if (g.frame === rushAt && !rushDone) { rushDone = true; perf.rushBullets = g.eBullets.count; perf.rushDraw = snap(`SWARM RUSH — DENSEST (the stage's S8 stress scene) · stageT ${g.stageT} f${g.frame} · bullets ${g.eBullets.count} enemies ${g.enemies.count}`, true); }
    if (g.frame === maxAt && !denseDone) { denseDone = true; perf.maxBullets = g.eBullets.count; perf.draw = snap(`RUN'S DENSEST FRAME · stageT ${g.stageT} f${g.frame} · bullets ${g.eBullets.count} enemies ${g.enemies.count}`, true); }
  } else if (MODE === 'boss') {
    if (boss && boss.phase !== prevPhase) { prevPhase = boss.phase; phaseAt = g.frame; }
    if (boss && g.frame === phaseAt + 150) snap(`THE MOTH QUEEN form ${boss.phase + 1} · ${['THE COCOON', 'THE MOTH', 'THE EMBER CORE'][boss.phase]} · +150f · bullets ${g.eBullets.count} · hp ${boss.hp | 0}`);
  } else if (MODE === 'moths') {
    if (moth && !mothAt && moth.phase === 1) mothAt = g.frame;
    if (mothAt && mothShots < 4 && (g.frame - mothAt) % 110 === 0) { mothShots++; snap(`THE TWIN MOTHS · f${g.frame} (+${g.frame - mothAt}) · moths ${g.enemies.items.filter ? '' : ''}${(() => { let n = 0, r = 0; for (let i = 0; i < g.enemies.count; i++) if (g.enemies.items[i].type === 13) { n++; if (g.enemies.items[i].bloomed) r++; } return n + (r ? ' (ENRAGED)' : ''); })()} · bullets ${g.eBullets.count}`); }
  }
  if (MODE === 'boss' && tiles.length >= 3) break;
  if (MODE === 'moths' && tiles.length >= 4) break;
}
const cols = MODE === 'sections' ? 4 : tiles.length || 1, tw = W * SC, th = H * SC;
label(`STAGE 3 — THE CANDLE SEA (r82, base skin${Q.get('skin') ? ' fallback via ?skin=' + Q.get('skin') : ''}) · seed C0FFEE · ${MODE === 'moths' ? 'passive-human bot' : 'expert bot'}, lives pinned · outcome ${g.state} f${g.frame}` + (MODE === 'sections' ? ` · swarm rush ${perf.rushBullets} bullets in ${perf.rushDraw.toFixed(2)} ms · run peak ${perf.maxBullets} in ${perf.draw.toFixed(2)} ms (budget 16.6)` : ''), 4, 16);
for (let i = 0; i < tiles.length; i++) {
  const x = (i % cols) * (tw + 4), y = Math.floor(i / cols) * (th + 30) + 46;
  ctx.drawImage(tiles[i].im, x, y, tw, th);
  label(tiles[i].text, x + 4, y - 8);
}
window.__perf = perf; window.__tiles = tiles.length; window.__done = true;
</script></body>
